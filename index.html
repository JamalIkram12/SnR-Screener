/* ---- Calendar ---- */
function viewCalendar() {
  const settings = Store.data.settings;
  const firstDow = Number(settings.firstDayOfWeek) || 0;
  const month = UI.calendarMonth;
  const selected = UI.calendarSelected;

  const monthStart = new Date(month.getFullYear(), month.getMonth(), 1);
  const offset = (monthStart.getDay() - firstDow + 7) % 7;
  const gridStart = addDays(monthStart, -offset);

  const cells = [];
  for (let i = 0; i < 42; i++) cells.push(addDays(gridStart, i));

  const monthLabel = MONTH_LONG[month.getMonth()] + ' ' + month.getFullYear();
  const wdHeaders = orderedWeekdays().map(d => DAY_SHORT[d]);

  const cellsHTML = cells.map(d => {
    const key = toKey(d);
    const inMonth = d.getMonth() === month.getMonth();
    const tasks = Scheduler.tasksForDate(key);
    const done = tasks.filter(t => isDone(t.id, key)).length;
    const pct = tasks.length ? Math.round((done / tasks.length) * 100) : 0;
    const isToday = key === todayKey();
    const isSelected = key === selected;

    const dotColors = [];
    const seen = {};
    tasks.forEach(t => {
      const c = getCategory(t.categoryId).color;
      if (!seen[c] && dotColors.length < 3) { seen[c] = true; dotColors.push(c); }
    });

    const classes = ['cal-day'];
    if (!inMonth) classes.push('out');
    if (isToday) classes.push('today');
    if (isSelected) classes.push('selected');

    const aria = fmtDateShort(d) +
      (tasks.length ? ', ' + tasks.length + (tasks.length === 1 ? ' task' : ' tasks') : ', no tasks');

    return '<button type="button" class="' + classes.join(' ') + '" ' +
      'data-action="cal-select" data-date="' + key + '" ' +
      'aria-label="' + esc(aria) + '"' +
      (isSelected ? ' aria-current="date"' : '') + '>' +
      '<span class="cal-num">' + d.getDate() + '</span>' +
      (tasks.length
        ? '<span class="cal-dots">' +
            dotColors.map(c => '<span class="cal-dot" style="background:' + c + '"></span>').join('') +
            (tasks.length > 3 ? '<span class="cal-more">+' + (tasks.length - 3) + '</span>' : '') +
          '</span>' +
          '<span class="cal-bar"><i style="width:' + pct + '%"></i></span>'
        : '<span class="cal-dots"></span><span class="cal-bar" style="visibility:hidden"><i style="width:0%"></i></span>') +
    '</button>';
  }).join('');

  const selDate = fromKey(selected);
  const selTasks = Scheduler.tasksForDate(selected);
  const selDone = selTasks.filter(t => isDone(t.id, selected)).length;

  const panelHTML =
    '<div class="cal-panel">' +
      '<div class="cal-panel-head">' +
        '<h3>' + esc(fmtDateRelative(selected)) + '</h3>' +
        '<span class="chip">' + fmtDateShort(selDate) + '</span>' +
        (selTasks.length
          ? '<span class="chip">' + svg('check', 12) + selDone + '/' + selTasks.length + ' complete</span>'
          : '') +
        '<span class="spacer"></span>' +
        (selTasks.length
          ? '<button class="btn btn-sm btn-ghost" data-action="clear-day" data-date="' + selected + '">' +
              svg('trash', 14) + 'Clear day</button>'
          : '') +
        '<button class="btn btn-sm btn-primary" data-action="new-task" data-date="' + selected + '">' +
          svg('plus', 14) + 'Add task</button>' +
      '</div>' +
      timeSortedTaskListHTML(selTasks, selected, 'No tasks on this day',
        'Pick another date or add a task to this day.') +
    '</div>';

  return '' +
    '<div class="cal-head">' +
      '<h2 class="cal-month">' + monthLabel + '</h2>' +
      '<div class="date-nav">' +
        '<button class="icon-btn" data-action="cal-nav" data-delta="-1" aria-label="Previous month">' +
          svg('chevronLeft', 17) + '</button>' +
        '<button class="label" data-action="cal-today">Today</button>' +
        '<button class="icon-btn" data-action="cal-nav" data-delta="1" aria-label="Next month">' +
          svg('chevronRight', 17) + '</button>' +
      '</div>' +
      '<span class="spacer"></span>' +
      '<span class="muted" style="font-size:12.5px">Click any date to see its tasks</span>' +
    '</div>' +
    '<div class="cal-wrap">' +
      '<div class="cal-weekdays">' +
        wdHeaders.map(d => '<div class="cal-wd">' + d + '</div>').join('') +
      '</div>' +
      '<div class="cal-grid">' + cellsHTML + '</div>' +
    '</div>' +
    panelHTML;
}

function renderApp() {
  $$('[data-nav]').forEach(el => {
    const active = el.getAttribute('data-nav') === UI.route;
    el.classList.toggle('active', active);
    if (active) el.setAttribute('aria-current', 'page');
    else el.removeAttribute('aria-current');
  });

  $('#pageTitle').textContent = PAGE_TITLES[UI.route] || 'RoutineOS';
  $('#topbarDate').textContent = fmtDateShort(new Date());

  const view = $('#view');
  view.innerHTML = VIEWS[UI.route]();
  view.classList.remove('view-enter');
  void view.offsetWidth;
  view.classList.add('view-enter');

  if (UI.route === 'overview') queueAfterRender(animateRings);
  runPostRender();

function refreshCurrentView() {
  if (UI.route === 'tasks') {
    const region = $('#taskListRegion');
    if (region) {
      region.innerHTML = taskListRegionHTML();
      return;
    }
  }
  renderApp();
}

function navigate(route) {
  if (!VIEWS[route]) route = 'overview';
  UI.route = route;
  closeDrawer();
  renderApp();
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function openDrawer() {
  $('#sidebar').classList.add('open');

function closeDrawer() {
  $('#sidebar').classList.remove('open');

  root.setAttribute('data-theme', s.theme);

/* ================================================================
   12. TASK COMMANDS
   ================================================================ */
function createTask(fields) {
  const now = new Date().toISOString();
  const task = normalizeTask(
    Object.assign({
      id: uid('task'),
      createdAt: now,
      updatedAt: now
    }, fields),
    Store.data.categories.map(c => c.id),
    Store.data.settings.defaultCategory
  );
  Store.data.tasks.push(task);
  Store.save();
  return task;
}

function updateTask(id, fields) {
  const task = getTask(id);
  if (!task) return null;
  const merged = Object.assign({}, task, fields, { updatedAt: new Date().toISOString() });
  const normalized = normalizeTask(merged, Store.data.categories.map(c => c.id), Store.data.settings.defaultCategory);
  normalized.id = task.id;
  normalized.createdAt = task.createdAt;
  // Preserve the exceptions array if the caller didn't supply a new one.
  if (fields.exceptions === undefined) normalized.exceptions = task.exceptions.slice();
  const idx = Store.data.tasks.indexOf(task);
  Store.data.tasks[idx] = normalized;
  Store.save();
  return normalized;
}

function deleteTask(id) {
  const task = getTask(id);
  if (!task) return;
  Store.data.tasks = Store.data.tasks.filter(t => t.id !== id);
  Store.data.routines.forEach(r => {
    const i = r.taskIds.indexOf(id);
    if (i !== -1) r.taskIds.splice(i, 1);
  });
  Object.keys(Store.data.completions).forEach(key => {
    if (key.indexOf(id + '|') === 0) delete Store.data.completions[key];
  });
  Store.save();
}

function createRoutine(fields) {
  const routine = normalizeRoutine(
    Object.assign({ id: uid('rt'), createdAt: new Date().toISOString() }, fields),
    Store.data.categories.map(c => c.id),
    Store.data.settings.defaultCategory
  );
  Store.data.routines.push(routine);
  Store.save();
  return routine;
}

function updateRoutine(id, fields) {
  const routine = getRoutine(id);
  if (!routine) return null;
  const merged = Object.assign({}, routine, fields);
  const normalized = normalizeRoutine(merged, Store.data.categories.map(c => c.id), Store.data.settings.defaultCategory);
  normalized.id = routine.id;
  normalized.createdAt = routine.createdAt;
  const idx = Store.data.routines.indexOf(routine);
  Store.data.routines[idx] = normalized;

  Store.data.tasks.forEach(t => {
    if (t.routineId === id && normalized.taskIds.indexOf(t.id) === -1) t.routineId = null;
  });
  normalized.taskIds.forEach(taskId => {
    const t = getTask(taskId);
    if (t) t.routineId = id;
  });

  Store.save();
  return normalized;
}

function deleteRoutine(id) {
  const routine = getRoutine(id);
  if (!routine) return;
  routine.taskIds.forEach(taskId => {
    const t = getTask(taskId);
    if (t) t.routineId = null;
  });
  Store.data.routines = Store.data.routines.filter(r => r.id !== id);
  Store.save();
}

        confirmLabel: 'Discard',
        cancelLabel: 'Keep editing'
      }).then(ok => { if (ok) closeLayer(layer); });
    } else {
      closeLayer(layer);
    }
  };
  layer.__onEscape = requestClose;
  layer.addEventListener('click', e => {
    if (e.target.getAttribute && e.target.getAttribute('data-close') === '1') requestClose();
    if (e.target.closest && e.target.closest('[data-action="close-modal"]')) requestClose();
  });

  form.addEventListener('submit', e => {
    e.preventDefault();
    submitTaskForm(layer, taskId);
  });

  queueAfterRender(() => { if (titleInput) titleInput.focus(); });
}

function recurrenceHint(type) {
  if (type === 'daily') {
    return 'This task will appear every day, starting from the date you chose.';
  }
  if (type === 'alternate') {
    return 'This task will appear every other day, counted from the start date. ' +
           'Example: start Monday → Mon, Wed, Fri, Sun, Tue…';
  }
  if (type === 'weekly') {
    return 'This task will appear on the selected weekdays only, starting from the chosen start date. ' +
           'For example: start on a Monday, select Mon–Wed, and it will appear every Mon, Tue and Wed from then on.';
  }
  return 'This task appears once, on the date you chose.';
}

function snapshotForm(layer) {
  const parts = [];
  $$('input, select, textarea', layer).forEach(el => {
    if (el.type === 'checkbox' || el.type === 'radio') parts.push(el.name + '=' + el.checked);
    else parts.push((el.name || el.id) + '=' + el.value);
  });
  $$('[data-weekdays="task"] .wd', layer).forEach(b => {
    parts.push('wd' + b.getAttribute('data-day') + '=' + b.classList.contains('on'));
  });
  return parts.join('|');
}

function submitTaskForm(layer, taskId) {
  const titleInput = $('#tf-title', layer);
  const dateInput = $('#tf-date', layer);
  const endInput = $('#tf-enddate', layer);
  const title = titleInput.value.trim();
  const dateValue = dateInput.value;
  const endValue = endInput ? endInput.value : '';
  const recType = $('#tf-rec', layer).value;
  const days = readWeekdayPicker('task');

  let valid = true;
  const setError = (name, show) => {
    const errEl = $('[data-err="' + name + '"]', layer);
    if (errEl) errEl.classList.toggle('show', show);
    const input = $('#tf-' + (name === 'title' ? 'title'
      : name === 'date' ? 'date'
      : name === 'endDate' ? 'enddate' : ''), layer);
    if (input) input.classList.toggle('invalid', show);
  };

  setError('title', false);
  setError('date', false);
  setError('days', false);
  setError('endDate', false);

  if (!title) { setError('title', true); valid = false; }
  if (!isValidKey(dateValue)) { setError('date', true); valid = false; }
  if (recType === 'weekly' && !days.length) { setError('days', true); valid = false; }

  // End date validation (optional).
  if (recType !== 'once' && endValue) {
    if (!isValidKey(endValue)) {
      setError('endDate', true); valid = false;
    } else if (isValidKey(dateValue) && endValue < dateValue) {
      setError('endDate', true); valid = false;
    }
  }

  if (!valid) {
    toast('Please fix the highlighted fields.', 'warn');
    if (!title) titleInput.focus();
    return;
  }

  const fields = {
    title: title,
    description: $('#tf-desc', layer).value.trim(),
    categoryId: $('#tf-cat', layer).value,
    date: dateValue,
    endDate: recType === 'once' ? '' : endValue,
    time: $('#tf-time', layer).value || '',
    priority: $('#tf-prio', layer).value,
    recurrence: {
      type: recType,
      days: recType === 'weekly' ? days : []
    }
  };

  if (taskId) {
    updateTask(taskId, fields);
    toast('Task updated.', 'success');
  } else {
    createTask(fields);
    toast('Task created.', 'success');
  }

  closeLayer(layer);
  refreshCurrentView();
}

        svg('check', 15) + (isEdit ? 'Save routine' : 'Create routine') + '</button>' +
    '</div>';

  const layer = openLayer(html, { labelledBy: titleId });
  const initialSnapshot = snapshotForm(layer);

  const schedSelect = $('#rf-sched', layer);
  const wdField = $('#rf-weekdays-field', layer);
  schedSelect.addEventListener('change', () => {
    wdField.hidden = schedSelect.value !== 'weekly';
  });

  $$('[data-weekdays="routine"] .wd', layer).forEach(btn => {
    btn.addEventListener('click', () => {
      const on = btn.classList.toggle('on');
      btn.setAttribute('aria-pressed', String(on));
    });
  });

  $$('[data-pick]', layer).forEach(label => {
    const input = $('input', label);
    input.addEventListener('change', () => {
      label.classList.toggle('on', input.checked);
      const count = $$('#rf-picks .pick.on', layer).length;
      const counter = $('#rf-count-label', layer);
      if (counter) {
        counter.innerHTML = 'Included tasks <span class="muted" style="font-weight:400">(' +
          count + ' selected)</span>';
      }
    });
  });

  const enabledSwitch = $('#rf-enabled', layer);
  enabledSwitch.addEventListener('click', () => {
    const on = enabledSwitch.classList.toggle('on');
    enabledSwitch.setAttribute('aria-checked', String(on));
  });

  $$('[data-action="pick-routine-color"]', layer).forEach(btn => {
    btn.addEventListener('click', () => {
      $$('[data-action="pick-routine-color"]', layer).forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      $('#rf-color', layer).value = btn.getAttribute('data-color');
    });
  });

  const requestClose = () => {
    if (snapshotForm(layer) !== initialSnapshot) {
      confirmDialog({
        title: 'Discard changes?',
        message: 'You have unsaved changes to this routine.',
        confirmLabel: 'Discard',
        cancelLabel: 'Keep editing'
      }).then(ok => { if (ok) closeLayer(layer); });
    } else {
      closeLayer(layer);
    }
  };
  layer.__onEscape = requestClose;
  layer.addEventListener('click', e => {
    if (e.target.getAttribute && e.target.getAttribute('data-close') === '1') requestClose();
    if (e.target.closest && e.target.closest('[data-action="close-modal"]')) requestClose();
  });

  $('form', layer).addEventListener('submit', e => {
    e.preventDefault();
    submitRoutineForm(layer, routineId);
  });

  queueAfterRender(() => { const n = $('#rf-name', layer); if (n) n.focus(); });
}

function submitRoutineForm(layer, routineId) {
  const nameInput = $('#rf-name', layer);
  const name = nameInput.value.trim();
  const schedType = $('#rf-sched', layer).value;
  const days = readWeekdayPicker('routine');

  if (!name) {
    $('[data-err="name"]', layer).classList.add('show');
    nameInput.classList.add('invalid');
    nameInput.focus();
    toast('Please name your routine.', 'warn');
    return;
  }

  const taskIds = $$('#rf-picks .pick.on', layer).map(l => l.getAttribute('data-pick'));
  const enabled = $('#rf-enabled', layer).classList.contains('on');

  const fields = {
    name: name,
    description: $('#rf-desc', layer).value.trim(),
    categoryId: $('#rf-cat', layer).value,
    color: $('#rf-color', layer).value,
    enabled: enabled,
    schedule: { type: schedType, days: schedType === 'weekly' ? days : [] },
    taskIds: taskIds
  };

  if (routineId) {
    updateRoutine(routineId, fields);
    toast('Routine updated.', 'success');
  } else {
    createRoutine(fields);
    toast('Routine created.', 'success');
  }

  closeLayer(layer);
  renderApp();
}

function confirmDeleteTask(id, dateKey) {
  const task = getTask(id);
  if (!task) return;

  if (Scheduler.isRecurring(task)) {
    openRecurringDeleteDialog(task, dateKey || Scheduler.referenceDate(task));
    return;
  }

  confirmDialog({
    title: 'Delete this task?',
    message: '“' + task.title + '” and its completion history will be permanently removed.',
    confirmLabel: 'Delete task'
  }).then(ok => {
    if (!ok) return;
    deleteTask(id);
    renderApp();
    toast('Task deleted.', 'success');
  });
}

function openRecurringDeleteDialog(task, dateKey) {
  const titleId = uid('deltitle');
  const whenLabel = fmtDateRelative(dateKey) + ' (' + fmtDateShort(fromKey(dateKey)) + ')';
  const isSameAsStart = dateKey === task.date;

  const html =
    '<div class="modal-head">' +
      '<div class="empty-ic" style="margin:0;width:38px;height:38px;border-radius:11px;' +
        'background:color-mix(in srgb, var(--danger) 16%, transparent);color:var(--danger)">' +
        svg('repeat', 18) +
      '</div>' +
      '<div>' +
        '<h2 id="' + titleId + '">Delete recurring task</h2>' +
        '<p>“' + esc(task.title) + '” repeats ' + esc(Scheduler.describe(task).toLowerCase()) +
          '. Choose what to remove.</p>' +
      '</div>' +
    '</div>' +

    '<div class="choice-list">' +
      '<button type="button" class="choice" data-choice="occurrence">' +
        '<span class="choice-title">' + svg('calendar', 14) + 'Remove only this occurrence</span>' +
        '<span class="choice-sub">Just ' + esc(whenLabel) + '. The rest of the series stays intact.</span>' +
      '</button>' +
      '<button type="button" class="choice danger" data-choice="series">' +
        '<span class="choice-title">' + svg('trash', 14) + 'Delete the entire series</span>' +
        '<span class="choice-sub">Every occurrence — past and future — will be permanently removed' +
          (isSameAsStart ? ', including its start date.' : '.') +
        '</span>' +
      '</button>' +
    '</div>' +

    '<div class="modal-foot">' +
      '<button class="btn" data-action="close-modal">Cancel</button>' +
    '</div>';

  const layer = openLayer(html, { size: 'sm', labelledBy: titleId });

  $$('[data-choice]', layer).forEach(btn => {
    btn.addEventListener('click', () => {
      const choice = btn.getAttribute('data-choice');
      closeLayer(layer);

      if (choice === 'occurrence') {
        skipOccurrence(task.id, dateKey);
      } else {
        deleteTask(task.id);
        renderApp();
        toast('Recurring task deleted.', 'success');
      }
    });
  });

  queueAfterRender(() => {
    const first = $('[data-choice]', layer);
    if (first) first.focus();
  });
}

function skipOccurrence(taskId, dateKey) {
  const task = getTask(taskId);
  if (!task) return;
  if (!Array.isArray(task.exceptions)) task.exceptions = [];
  if (task.exceptions.indexOf(dateKey) === -1) task.exceptions.push(dateKey);
  const key = completionKey(taskId, dateKey);
  if (Store.data.completions[key]) delete Store.data.completions[key];
  Store.save();
  renderApp();
  toast('Removed from ' + fmtDateRelative(dateKey) + '.', 'success');
}

function clearDay(dateKey) {
  const tasks = Scheduler.tasksForDate(dateKey);
  if (!tasks.length) {
    toast('No tasks are scheduled for this day.', 'info');
    return;
  }

  const recurring = tasks.filter(t => Scheduler.isRecurring(t));
  const oneTime = tasks.filter(t => !Scheduler.isRecurring(t));

  const parts = [];
  if (oneTime.length) {
    parts.push(oneTime.length + ' one-time ' + (oneTime.length === 1 ? 'task will be deleted' : 'tasks will be deleted'));
  }
  if (recurring.length) {
    parts.push(recurring.length + ' recurring ' + (recurring.length === 1 ? 'task will be skipped' : 'tasks will be skipped') +
      ' on this day only');
  }

  confirmDialog({
    title: 'Clear all tasks for this day?',
    message: parts.join(' · ') + '. This affects only ' + fmtDateRelative(dateKey) + '.',
    confirmLabel: 'Clear day'
  }).then(ok => {
    if (!ok) return;

    oneTime.forEach(t => deleteTask(t.id));
    recurring.forEach(t => {
      if (!Array.isArray(t.exceptions)) t.exceptions = [];
      if (t.exceptions.indexOf(dateKey) === -1) t.exceptions.push(dateKey);
    });

    tasks.forEach(t => {
      const key = completionKey(t.id, dateKey);
      if (Store.data.completions[key]) delete Store.data.completions[key];
    });

    Store.save();
    renderApp();
    toast('Day cleared.', 'success');
  });
}

function confirmDeleteRoutine(id) {
  const routine = getRoutine(id);
  if (!routine) return;
  confirmDialog({
    title: 'Delete this routine?',
    message: '“' + routine.name + '” will be removed. Its tasks will stay in your workspace, unassigned.',
    confirmLabel: 'Delete routine'
  }).then(ok => {
    if (!ok) return;
    deleteRoutine(id);
    renderApp();
    toast('Routine deleted.', 'success');
  });
}

/* ================================================================
   16. GLOBAL EVENT DELEGATION
   ================================================================ */
document.addEventListener('click', e => {
  const trigger = e.target.closest ? e.target.closest('[data-action]') : null;
  if (!trigger) return;
  const action = trigger.getAttribute('data-action');

  switch (action) {
    case 'nav':
      navigate(trigger.getAttribute('data-route'));
      break;

    case 'toggle-drawer':
      if ($('#sidebar').classList.contains('open')) closeDrawer();
      else openDrawer();
      break;

    case 'toggle-sidebar': {
      const s = Store.data.settings;
      s.sidebarCollapsed = !s.sidebarCollapsed;
      Store.save();
      applyAppearance();
      break;
    }

    case 'toggle-theme': {
      const s = Store.data.settings;
      s.theme = s.theme === 'dark' ? 'light' : 'dark';
      Store.save();
      applyAppearance();
      const select = $('#setTheme');
      if (select) select.value = s.theme;
      toast(s.theme === 'dark' ? 'Dark theme enabled.' : 'Light theme enabled.');
      break;
    }

    case 'clear-search':
      setSearch('');
      break;

    case 'new-task':
      openTaskModal(null, { date: trigger.getAttribute('data-date') || undefined });
      break;

    case 'edit-task':
      openTaskModal(trigger.getAttribute('data-id'));
      break;

    case 'delete-task':
      confirmDeleteTask(trigger.getAttribute('data-id'), trigger.getAttribute('data-date'));
      break;

    case 'delete-task-in-modal': {
      const id = trigger.getAttribute('data-id');
      const layer = UI.modalStack[UI.modalStack.length - 1];
      if (layer) { layer.__onEscape = null; closeLayer(layer); }
      const t = getTask(id);
      if (t) confirmDeleteTask(id, Scheduler.referenceDate(t));
      break;
    }

    case 'toggle-task': {
      const id = trigger.getAttribute('data-id');
      const dateKey = trigger.getAttribute('data-date') || todayKey();
      const task = getTask(id);
      if (!task) return;
      const nowDone = toggleCompletion(id, dateKey);
      const item = document.querySelector('.task[data-task="' + id + '"]');
      if (item) item.classList.toggle('is-done', nowDone);
      trigger.setAttribute('aria-pressed', String(nowDone));
      setTimeout(() => { refreshCurrentView(); }, 190);
      break;
    }

    case 'clear-day':
      clearDay(trigger.getAttribute('data-date'));
      break;

    case 'day-nav': {
      const delta = Number(trigger.getAttribute('data-delta')) || 0;
      UI.myDayDate = toKey(addDays(fromKey(UI.myDayDate), delta));
      renderApp();
      break;
    }

    case 'day-today':
      UI.myDayDate = todayKey();
      renderApp();
      break;

    case 'cal-nav': {
      const delta = Number(trigger.getAttribute('data-delta')) || 0;
      const m = UI.calendarMonth;
      UI.calendarMonth = new Date(m.getFullYear(), m.getMonth() + delta, 1);
      renderApp();
      break;
    }

    case 'cal-today': {
      const now = new Date();
      UI.calendarMonth = new Date(now.getFullYear(), now.getMonth(), 1);
      UI.calendarSelected = todayKey();
      renderApp();
      break;
    }

    case 'cal-select': {
      const key = trigger.getAttribute('data-date');
      if (!isValidKey(key)) break;
      UI.calendarSelected = key;
      const d = fromKey(key);
      if (d.getMonth() !== UI.calendarMonth.getMonth() ||
          d.getFullYear() !== UI.calendarMonth.getFullYear()) {
        UI.calendarMonth = new Date(d.getFullYear(), d.getMonth(), 1);
      }
      renderApp();
      break;
    }

    case 'reset-filters':
      UI.filters = { category: 'all', status: 'all', priority: 'all', sort: 'time' };
      setSearch('');
      renderApp();
      break;

    case 'new-routine':
      openRoutineModal(null);
      break;

    case 'edit-routine':
      openRoutineModal(trigger.getAttribute('data-id'));
      break;

    case 'delete-routine':
      confirmDeleteRoutine(trigger.getAttribute('data-id'));
      break;

    case 'add-task-to-routine':
      openTaskModal(null, { routineId: trigger.getAttribute('data-id') });
      break;

    case 'toggle-routine': {
      const routine = getRoutine(trigger.getAttribute('data-id'));
      if (!routine) return;
      routine.enabled = !routine.enabled;
      Store.save();
      toast('“' + routine.name + '” ' + (routine.enabled ? 'enabled' : 'disabled') + '.');
      renderApp();
      break;
    }

    case 'close-modal': {
      const layer = trigger.closest('.modal-layer');
      if (layer && typeof layer.__onEscape === 'function') layer.__onEscape();
      else if (layer) closeLayer(layer);
      break;
    }

    case 'save-task':
      submitTaskForm(trigger.closest('.modal-layer'), trigger.getAttribute('data-id') || null);
      break;

    case 'save-routine':
      submitRoutineForm(trigger.closest('.modal-layer'), trigger.getAttribute('data-id') || null);
      break;

    case 'set-accent':
      setSetting('accent', trigger.getAttribute('data-color'), true);
      renderApp();
      break;

    case 'reset-settings':
      confirmDialog({
        title: 'Reset settings to defaults?',
        message: 'Your tasks, routines and completion history will be kept.',
        confirmLabel: 'Reset settings'
      }).then(ok => {
        if (!ok) return;
        Store.data.settings = Object.assign({}, DEFAULT_SETTINGS);
        Store.save();
        applyAppearance();
        renderApp();
        toast('Settings reset to defaults.', 'success');
      });
      break;

    case 'load-demo':
      confirmDialog({
        title: 'Load starter data?',
        message: 'This adds the sample routines and tasks to your workspace. Existing items are kept.',
        confirmLabel: 'Load starter data',
        danger: false
      }).then(ok => {
        if (!ok) return;
        mergeStarterData();
        Store.save();
        renderApp();
        toast('Starter data added.', 'success');
      });
      break;

    case 'clear-tasks':
      confirmDialog({
        title: 'Delete all tasks?',
        message: 'Every task and its completion history will be permanently removed. Routines will be emptied.',
        confirmLabel: 'Delete all tasks'
      }).then(ok => {
        if (!ok) return;
        Store.data.tasks = [];
        Store.data.completions = {};
        Store.data.routines.forEach(r => { r.taskIds = []; });
        Store.save();
        renderApp();
        toast('All tasks deleted.', 'success');
      });
      break;

    case 'clear-all':
      confirmDialog({
        title: 'Erase everything?',
        message: 'Tasks, routines, completions and settings will be permanently deleted from this browser.',
        confirmLabel: 'Erase everything'
      }).then(ok => {
        if (!ok) return;
        try { window.localStorage.removeItem(STORAGE_KEY); } catch (err) { /* ignore */ }
        Store.data = Store.normalize({});
        Store.save();
        applyAppearance();
        navigate('overview');
        toast('Workspace erased.', 'success');
      });
      break;

    default:
      break;
  }
});

/* Change events: filters and settings */
document.addEventListener('change', e => {
  const filterSelect = e.target.closest ? e.target.closest('[data-filter]') : null;
  if (filterSelect) {
    const key = filterSelect.getAttribute('data-filter');
    UI.filters[key] = filterSelect.value;
    refreshCurrentView();
    return;
  }

  const settingEl = e.target.closest ? e.target.closest('[data-setting]') : null;
  if (settingEl) {
    const key = settingEl.getAttribute('data-setting');
    let value = settingEl.value;
    if (key === 'firstDayOfWeek') value = Number(value);
    setSetting(key, value, false);
    if (['theme', 'accent', 'density'].indexOf(key) !== -1) applyAppearance();
    if (key === 'firstDayOfWeek') renderApp();
    return;
  }
});

/* Input events: live search fields */
document.addEventListener('input', debounce(e => {
  if (e.target && e.target.id === 'listSearch') {
    setSearch(e.target.value, true);
  }
}, 180));

document.addEventListener('input', e => {
  if (!e.target) return;

  if (e.target.id === 'globalSearch') {
    setSearch(e.target.value, false);
    return;
  }

  const settingEl = e.target.closest ? e.target.closest('[data-setting]') : null;
  if (settingEl && settingEl.tagName === 'INPUT' && settingEl.type === 'text') {
    setSetting(settingEl.getAttribute('data-setting'), settingEl.value, false);
  }
});

/* Click outside drawer */
document.addEventListener('click', e => {
  const sidebar = $('#sidebar');
  if (!sidebar || !sidebar.classList.contains('open')) return;
  if (e.target.closest('#sidebar') || e.target.closest('[data-action="toggle-drawer"]')) return;
  closeDrawer();
});

$('#scrim').addEventListener('click', closeDrawer);

/* Window resize */
window.addEventListener('resize', debounce(() => {
  const app = $('#app');
  if (!app) return;
  if (window.innerWidth <= 900) {

    recurrence: { type: 'daily', days: [] }

    priority: 'medium', description: 'Drink a glass of water.',
    recurrence: { type: 'daily', days: [] }
  });

  });

    });
  });

  return {
    version: DATA_VERSION,
    settings: Object.assign({}, DEFAULT_SETTINGS),
    categories: DEFAULT_CATEGORIES.map(c => Object.assign({}, c)),
    tasks: tasks,
    routines: routines,
    completions: {},
    seeded: true
  };
}

function mergeStarterData() {
  const fresh = buildStarterData();
  const existingTitles = {};
  Store.data.tasks.forEach(t => { existingTitles[t.title.toLowerCase()] = true; });

  const idMap = {};
  fresh.tasks.forEach(t => {
    if (existingTitles[t.title.toLowerCase()]) return;
    const clone = normalizeTask(
      Object.assign({}, t, { id: uid('task') }),
      Store.data.categories.map(c => c.id),
      Store.data.settings.defaultCategory
    );
    idMap[t.id] = clone.id;
    Store.data.tasks.push(clone);
    existingTitles[clone.title.toLowerCase()] = true;
  });

  const existingRoutines = {};
  Store.data.routines.forEach(r => { existingRoutines[r.name.toLowerCase()] = true; });

  fresh.routines.forEach(r => {
    if (existingRoutines[r.name.toLowerCase()]) return;
    const taskIds = r.taskIds.map(id => idMap[id]).filter(Boolean);
    const clone = normalizeRoutine(
      Object.assign({}, r, { id: uid('rt'), taskIds: taskIds }),
      Store.data.categories.map(c => c.id),
      Store.data.settings.defaultCategory
    );
    Store.data.routines.push(clone);
    taskIds.forEach(taskId => {
      const t = getTask(taskId);
      if (t) t.routineId = clone.id;
    });
    existingRoutines[clone.name.toLowerCase()] = true;
  });
}

/* ================================================================
   18. INITIALISATION
   ================================================================ */
function init() {
  try {
    Store.load();
  } catch (err) {
    console.error('[RoutineOS] Failed to initialise store.', err);
    Store.data = Store.normalize({});
  }

  if (!Store.data || !Array.isArray(Store.data.tasks)) {
    Store.data = Store.normalize({});
  }

  applyAppearance();
  renderSidebar();
  applyAppearance();

  UI.route = 'overview';
  UI.myDayDate = todayKey();
  const now = new Date();
  UI.calendarMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  UI.calendarSelected = todayKey();
  renderApp();

  setTimeout(() => {
    const s = Store.data.settings;
    const h = new Date().getHours();
    const when = h < 12 ? 'morning' : h < 18 ? 'afternoon' : 'evening';
    toast('Good ' + when + ', ' + s.displayName + '. Your workspace is ready.', 'success');
  }, 500);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
