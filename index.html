<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crypto Key Levels Screener — Bjorgum Key Levels + ATR Trailing Stop</title>
<style>
  :root {
    --bg: #0b0e13;
    --panel: #131820;
    --panel2: #1a2029;
    --border: #232b36;
    --text: #e6edf3;
    --muted: #7d8797;
    --blue: #4aa8ff;
    --cyan: #22d3ee;
    --yellow: #ffd24a;
    --green: #22c55e;
    --red: #ef4444;
    --support-bg: rgba(74, 168, 255, 0.08);
    --flipped-bg: rgba(34, 211, 238, 0.08);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 13px;
    line-height: 1.4;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #0f141b, #0b0e13);
    position: sticky; top: 0; z-index: 20;
  }
  .header h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }
  .header h1 span { color: var(--blue); }
  .header .status { display: flex; gap: 16px; align-items: center; font-size: 12px; color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #444; margin-right: 6px; vertical-align: middle; }
  .dot.green { background: var(--green); box-shadow: 0 0 6px rgba(34,197,94,0.7); }
  .dot.red { background: var(--red); box-shadow: 0 0 6px rgba(239,68,68,0.7); }
  .dot.amber { background: #f59e0b; box-shadow: 0 0 6px rgba(245,158,11,0.7); }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-wrap: wrap;
  }
  .tf-group { display: flex; gap: 0; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
  .tf-btn {
    background: transparent;
    color: var(--muted);
    border: none;
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    border-right: 1px solid var(--border);
  }
  .tf-btn:last-child { border-right: none; }
  .tf-btn:hover { background: var(--panel2); color: var(--text); }
  .tf-btn.active { background: var(--blue); color: #fff; }
  .btn {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn:hover { background: #232c38; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .filters {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-wrap: wrap;
  }
  .filter-group { display: flex; align-items: center; gap: 8px; }
  .filter-group label { font-size: 12px; color: var(--muted); font-weight: 500; }
  select {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    outline: none;
    cursor: pointer;
  }
  select:hover { border-color: #3a4553; }

  .table-wrap { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  thead th {
    background: var(--panel);
    color: var(--muted);
    font-weight: 600;
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 5;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    user-select: none;
  }
  thead th.sortable { cursor: pointer; }
  thead th.sortable:hover { color: var(--text); }
  thead th .sort-arrow { font-size: 9px; margin-left: 4px; opacity: 0.7; }
  tbody td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tbody tr:hover { background: rgba(255,255,255,0.02); }
  tbody tr.hidden { display: none; }

  .pair { font-weight: 700; font-size: 13px; letter-spacing: 0.3px; color: #dbe6f2; }
  .pair .quote { color: var(--muted); font-weight: 500; }
  .price { font-weight: 600; font-variant-numeric: tabular-nums; color: #fff; font-size: 13px; }

  .zones { display: flex; flex-direction: column; gap: 6px; }
  .zone {
    background: var(--support-bg);
    border: 1px solid rgba(74, 168, 255, 0.25);
    border-left: 3px solid var(--blue);
    padding: 6px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    min-width: 140px;
  }
  .zone.flipped {
    background: var(--flipped-bg);
    border-color: rgba(34, 211, 238, 0.25);
    border-left-color: var(--cyan);
  }
  .zone .row { display: flex; justify-content: space-between; gap: 8px; }
  .zone .lbl { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; }
  .zone .val { font-weight: 600; }
  .zone .dist {
    margin-top: 3px;
    padding-top: 3px;
    border-top: 1px dashed rgba(255,255,255,0.08);
    color: var(--blue);
    font-weight: 700;
    text-align: right;
  }
  .zone.flipped .dist { color: var(--cyan); }
  .zone.inside .dist { color: var(--yellow); }
  .zone.na {
    background: transparent;
    border: 1px dashed var(--border);
    border-left: 3px solid var(--border);
    color: var(--muted);
    text-align: center;
    padding: 8px;
    font-style: italic;
    font-size: 11px;
  }

  /* ATR Trailing Stop cell */
  .atr-cell {
    font-variant-numeric: tabular-nums;
    min-width: 150px;
    padding: 4px 6px;
    border-radius: 4px;
    background: rgba(255,255,255,0.02);
    border-left: 3px solid var(--border);
  }
  .atr-cell .atr-status {
    font-weight: 700;
    font-size: 12px;
    margin-bottom: 4px;
    letter-spacing: 0.3px;
  }
  .atr-cell .atr-pct { font-weight: 700; }
  .atr-cell .atr-line {
    font-size: 11px;
    color: var(--muted);
    font-weight: 500;
  }
  .atr-cell.above {
    border-left-color: var(--green);
    background: rgba(34,197,94,0.06);
  }
  .atr-cell.above .atr-status { color: var(--green); }
  .atr-cell.below {
    border-left-color: var(--red);
    background: rgba(239,68,68,0.06);
  }
  .atr-cell.below .atr-status { color: var(--red); }
  .atr-cell.at-line {
    border-left-color: var(--yellow);
    background: rgba(255,210,74,0.06);
  }
  .atr-cell.at-line .atr-status { color: var(--yellow); }
  .atr-cell.na {
    color: var(--muted);
    font-style: italic;
    text-align: center;
    border: 1px dashed var(--border);
    border-left: 3px solid var(--border);
    background: transparent;
    padding: 8px;
    font-size: 11px;
  }

  .empty-cell { color: var(--muted); font-style: italic; }
  .loading-msg { padding: 40px; text-align: center; color: var(--muted); font-size: 13px; }

  .error-banner {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.4);
    color: #fca5a5;
    padding: 10px 18px;
    font-size: 12px;
  }

  @media (max-width: 700px) {
    .header { flex-direction: column; align-items: flex-start; gap: 8px; }
    .header .status { font-size: 11px; }
  }
</style>

<body>

<div class="header">
  <h1>Crypto Key Levels <span>Screener</span></h1>
  <div class="status">
    <span><span id="ws-dot" class="dot"></span><span id="ws-status">Connecting…</span></span>
    <span>Symbols: <span id="symbol-count">—</span></span>

  </div>
</div>

<div id="error-banner" class="error-banner" style="display:none;"></div>

<div class="toolbar">
  <div class="tf-group" id="tf-group">
    <button class="tf-btn active" data-tf="5m">5 Minutes</button>

    Bjorgum Key Levels · left=14 right=20 · nPiv=2 · ATR(30)×0.5 &nbsp;|&nbsp; ATR Trailing Stop · ATR(12)×3
  </span>

<div class="filters">
  <div class="filter-group">
    <label for="supportFilter">Support:</label>

      <option value="all" selected>All</option>

  <button class="btn" id="reset-filters">Reset Filters</button>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th class="sortable" data-sort="symbol" style="min-width:120px;">Crypto Pair <span class="sort-arrow"></span></th>
        <th class="sortable" data-sort="price" style="min-width:100px;">Current Price <span class="sort-arrow"></span></th>
        <th class="sortable" data-sort="support" style="min-width:200px;">Support Zones <span class="sort-arrow"></span></th>
        <th class="sortable" data-sort="flipped" style="min-width:200px;">Flipped Support Zones <span class="sort-arrow"></span></th>
        <th class="sortable" data-sort="atr" style="min-width:150px;">ATR Trailing Stop <span class="sort-arrow"></span></th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="5" class="loading-msg">Initializing…</td></tr>
    </tbody>
  </table>
</div>

<script>
'use strict';

/* =====================================================================
   CONSTANTS & LOCKED INDICATOR PARAMETERS
   ===================================================================== */
const TF_LABELS = { '5m': '5 Minutes', '15m': '15 Minutes', '1h': '1 Hour', '4h': '4 Hours' };
const TF_MS = { '5m': 300000, '15m': 900000, '1h': 3600000, '4h': 14400000 };

/* --- Bjorgum Key Levels (locked) --- */
const LEFT = 14;
const RIGHT = 20;
const NPIV = 2;
const ATR_LEN_BJ = 30;
const MULT_BJ = 0.5;
const PER_BJ = 5;

/* --- ATR Trailing Stop (from supplied Pine v5 source) --- */
const ATR_PERIOD_TS = 12;
const ATR_MULT_TS = 3;

const INITIAL_BARS = 1000;
const FETCH_CONCURRENCY = 15;             // parallel REST calls
const SYMBOL_REFRESH_MS = 3 * 60 * 1000;   // poll exchangeInfo every 3 minutes
const WS_URL_BASE = 'wss://stream.binance.com:9443/stream?streams=';

/* =====================================================================
   STATE
   ===================================================================== */
const state = {
  timeframe: '5m',
  sortKey: 'symbol',
  sortDir: 1,
  symbolList: [],           // dynamic list of USDT pairs
  symbols: {},              // SYMBOL -> { bars, highZones, lowZones, atrLine, currentPrice, status, error }
  pendingSymbols: new Set(),
  bulkLoadCount: 0,
  symbolRefreshing: false,
  ws: null,
  refreshTimer: null,
  symbolRefreshTimer: null,
  renderScheduled: false,
  fetchGen: 0,
  lastUpdated: 0,
  initialLoaded: false
};

/* =====================================================================
   UTILITIES
   ===================================================================== */
function fmtPrice(p) {
  if (p == null || isNaN(p)) return '—';
  const a = Math.abs(p);
  let d;
  if (a >= 1000) d = 2;
  else if (a >= 100) d = 3;
  else if (a >= 1) d = 4;
  else if (a >= 0.01) d = 5;
  else if (a >= 0.0001) d = 7;
  else d = 10;
  return p.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
}

function fmtDist(d) {
  if (d == null || isNaN(d)) return '—';
  const v = d < 0 ? d : -d;
  return v.toFixed(2) + '%';
}

function displayPair(sym) {
  const base = sym.replace(/USDT$/, '');
  return base + '<span class="quote">/USDT</span>';
}

function setWSDot(cls, text) {
  const dot = document.getElementById('ws-dot');
  dot.className = 'dot ' + cls;
  document.getElementById('ws-status').textContent = text;
}

function setLastUpdated() {
  const d = new Date();
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  const ss = String(d.getSeconds()).padStart(2, '0');
  document.getElementById('last-updated').textContent = `${hh}:${mm}:${ss}`;
  state.lastUpdated = Date.now();
}

function setSymbolCount(n) {
  document.getElementById('symbol-count').textContent = n;
}

function showError(msg) {
  const b = document.getElementById('error-banner');
  b.textContent = msg;
  b.style.display = 'block';
}
function clearError() {
  document.getElementById('error-banner').style.display = 'none';
}

/* =====================================================================
   BINANCE REST — SYMBOL LIST
   ===================================================================== */
async function fetchUSDTSymbols() {
  const resp = await fetch('https://api.binance.com/api/v3/exchangeInfo');
  if (!resp.ok) throw new Error(`HTTP ${resp.status} fetching exchangeInfo`);
  const data = await resp.json();
  return data.symbols
    .filter(s => s.quoteAsset === 'USDT' && s.status === 'TRADING')
    .map(s => s.symbol)
    .sort();
}

/* =====================================================================
   BINANCE REST — KLINES
   ===================================================================== */
async function fetchKlines(symbol, interval, limit) {
  const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status} fetching ${symbol}`);
  return await resp.json();
}

async function fetchKlinesSince(symbol, interval, startTime) {
  const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&startTime=${startTime}&limit=500`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status} fetching ${symbol}`);
  return await resp.json();
}

function parseKlines(raw) {
  const out = [];
  for (const k of raw) {
    out.push({
      time: k[0],
      closeTime: k[6],
      open: parseFloat(k[1]),
      high: parseFloat(k[2]),
      low: parseFloat(k[3]),
      close: parseFloat(k[4])
    });
  }
  return out;
}

/* =====================================================================
   ATR (Wilder's RMA of True Range) — used by both indicators
   ===================================================================== */
function calcATR(highs, lows, closes, len) {
  const n = highs.length;
  if (n === 0) return [];
  const tr = new Array(n);
  tr[0] = highs[0] - lows[0];
  for (let i = 1; i < n; i++) {
    tr[i] = Math.max(
      highs[i] - lows[i],
      Math.abs(highs[i] - closes[i - 1]),
      Math.abs(lows[i] - closes[i - 1])
    );
  }
  const atr = new Array(n).fill(NaN);
  if (n < len) return atr;
  let sum = 0;
  for (let i = 0; i < len; i++) sum += tr[i];
  atr[len - 1] = sum / len;
  for (let i = len; i < n; i++) {
    atr[i] = (atr[i - 1] * (len - 1) + tr[i]) / len;
  }
  return atr;
}

/* =====================================================================
   BJORGUM KEY LEVELS — zone generation
   ===================================================================== */
function isPivotHigh(highs, idx, left, right) {
  if (idx - left < 0 || idx + right >= highs.length) return false;
  const v = highs[idx];
  for (let j = idx - left; j < idx; j++) {
    if (highs[j] >= v) return false;
  }
  for (let j = idx + 1; j <= idx + right; j++) {
    if (highs[j] >= v) return false;
  }
  return true;
}

function isPivotLow(lows, idx, left, right) {
  if (idx - left < 0 || idx + right >= lows.length) return false;
  const v = lows[idx];
  for (let j = idx - left; j < idx; j++) {
    if (lows[j] <= v) return false;
  }
  for (let j = idx + 1; j <= idx + right; j++) {
    if (lows[j] <= v) return false;
  }
  return true;
}

function alignZones(xArr, yArr) {
  if (yArr.length === 0) return;
  const y0 = yArr[0];
  for (let i = 0; i < xArr.length; i++) {
    const xi = xArr[i];
    const T = y0.top, B = y0.bottom;
    const t = xi.top, b = xi.bottom;
    if (
      (T > b && T < t) ||
      (B < t && B > b) ||
      (T > t && B < b) ||
      (B > b && T < t)
    ) {
      y0.top = t;
      y0.bottom = b;
    }
  }
}

function updateZoneColors(zones, close) {
  for (const z of zones) {
    if (close > z.top && !z.isBull) z.isBull = true;
    if (close < z.bottom && z.isBull) z.isBull = false;
  }
}

function computeZones(bars) {
  const n = bars.length;
  const highs = new Array(n), lows = new Array(n), closes = new Array(n);
  for (let i = 0; i < n; i++) {
    highs[i] = bars[i].high;
    lows[i] = bars[i].low;
    closes[i] = bars[i].close;
  }

  const atr = calcATR(highs, lows, closes, ATR_LEN_BJ);

  const band = new Array(n).fill(NaN);
  for (let i = RIGHT; i < n; i++) {
    const j = i - RIGHT;
    if (!isNaN(atr[j])) {
      band[i] = Math.min(atr[j] * MULT_BJ, closes[j] * (PER_BJ / 100)) / 2;
    }
  }

  const highZones = [];
  const lowZones  = [];

  for (let i = 0; i < n; i++) {
    const pIdx = i - RIGHT;

    if (pIdx >= LEFT) {
      if (isPivotHigh(highs, pIdx, LEFT, RIGHT)) {
        const bw = band[i];
        if (!isNaN(bw)) {
          const pv = highs[pIdx];
          highZones.unshift({
            top: pv + bw,
            bottom: pv - bw,
            isBull: false,
            startBar: pIdx
          });
          if (highZones.length > NPIV) highZones.pop();
        }
      }
      if (isPivotLow(lows, pIdx, LEFT, RIGHT)) {
        const bw = band[i];
        if (!isNaN(bw)) {
          const pv = lows[pIdx];
          lowZones.unshift({
            top: pv + bw,
            bottom: pv - bw,
            isBull: true,
            startBar: pIdx
          });
          if (lowZones.length > NPIV) lowZones.pop();
        }
      }
    }

    alignZones(highZones, highZones);
    alignZones(highZones, lowZones);
    alignZones(lowZones,  lowZones);
    alignZones(lowZones,  highZones);

    updateZoneColors(highZones, closes[i]);
    updateZoneColors(lowZones,  closes[i]);
  }

  return { highZones, lowZones };
}

/* =====================================================================
   ATR TRAILING STOP — faithful port of supplied Pine v5 source
   ===================================================================== */
function calcATRTrailingStop(bars) {
  const n = bars.length;
  if (n === 0) return [];
  const closes = new Array(n), highs = new Array(n), lows = new Array(n);
  for (let i = 0; i < n; i++) {
    closes[i] = bars[i].close;
    highs[i]  = bars[i].high;
    lows[i]   = bars[i].low;
  }
  const atr = calcATR(highs, lows, closes, ATR_PERIOD_TS);

  const result = new Array(n).fill(NaN);
  let prev = NaN;

  for (let i = 0; i < n; i++) {
    const stop = ATR_MULT_TS * atr[i];
    const close = closes[i];
    const prevClose = i > 0 ? closes[i - 1] : NaN;

    let val;
    if (close > prev && prevClose > prev) {
      val = Math.max(prev, close - stop);
    } else if (close < prev && prevClose < prev) {
      val = Math.min(prev, close + stop);
    } else if (close > prev) {
      val = close - stop;
    } else {
      val = close + stop;
    }

    result[i] = val;
    prev = val;
  }

  return result;
}

/* =====================================================================
   DISTANCE COMPUTATION
   ===================================================================== */
function zoneDistance(currentPrice, zone) {
  if (currentPrice > zone.top) {
    return ((zone.top - currentPrice) / currentPrice) * 100;
  } else if (currentPrice < zone.bottom) {
    return null;
  } else {
    return 0;
  }
}

function getValidZones(zones, currentPrice, wantBull) {
  const out = [];
  for (const z of zones) {
    if (z.isBull !== wantBull) continue;
    const d = zoneDistance(currentPrice, z);
    if (d === null) continue;
    out.push({ top: z.top, bottom: z.bottom, dist: d, isBull: z.isBull, inside: d === 0 });
  }
  out.sort((a, b) => Math.abs(a.dist) - Math.abs(b.dist));
  return out;
}

/* =====================================================================
   ATR TRAILING STOP — classification helpers
   ===================================================================== */
function atrDiffPct(currentPrice, atrLine) {
  if (currentPrice == null || atrLine == null || isNaN(atrLine)) return NaN;
  return ((currentPrice - atrLine) / atrLine) * 100;
}

function classifyATR(price, atrLine) {
  if (price == null || atrLine == null || isNaN(atrLine) || !isFinite(atrLine)) {
    return 'missing';
  }
  const diff = atrDiffPct(price, atrLine);
  if (!isFinite(diff)) return 'missing';
  if (diff === 0) return 'at-line';
  const abs = Math.abs(diff);
  if (diff > 0) {
    return abs > 1 ? 'above' : 'touching-above';
  } else {
    return abs > 1 ? 'below' : 'touching-below';
  }
}

/* =====================================================================
   DATA LOADING — batched with concurrency limit
   ===================================================================== */
function buildSymbolState(sym, rawClosed) {
  const bars = parseKlines(rawClosed);
  if (bars.length === 0) {
    return {
      bars: [], highZones: [], lowZones: [], atrLine: NaN,
      currentPrice: null, status: 'error', error: 'No data'
    };
  }
  const { highZones, lowZones } = computeZones(bars);
  const atrArr = calcATRTrailingStop(bars);
  let atrLine = NaN;
  for (let i = atrArr.length - 1; i >= 0; i--) {
    if (!isNaN(atrArr[i])) { atrLine = atrArr[i]; break; }
  }
  const lastBar = bars[bars.length - 1];
  return {
    bars, highZones, lowZones, atrLine,
    currentPrice: lastBar.close, status: 'ok', error: null
  };
}

async function loadSymbols(symbols, tf, gen) {
  if (symbols.length === 0) return;
  state.bulkLoadCount++;
  try {
    let done = 0;
    for (let i = 0; i < symbols.length; i += FETCH_CONCURRENCY) {
      if (gen !== state.fetchGen) return;
      const batch = symbols.slice(i, i + FETCH_CONCURRENCY);
      const results = await Promise.allSettled(
        batch.map(async (sym) => {
          const raw = await fetchKlines(sym, tf, INITIAL_BARS);
          return { sym, raw };
        })
      );
      if (gen !== state.fetchGen) return;

      for (const r of results) {
        if (r.status === 'fulfilled') {
          const { sym, raw } = r.value;
          const prev = state.symbols[sym];
          const next = buildSymbolState(sym, raw.slice(0, -1));
          if (prev && prev.currentPrice != null && next.status === 'ok') {
            next.currentPrice = prev.currentPrice;
          }
          state.symbols[sym] = next;
        } else {
          const sym = batch[results.indexOf(r)];
          state.symbols[sym] = {
            bars: [], highZones: [], lowZones: [], atrLine: NaN,
            currentPrice: null, status: 'error',
            error: (r.reason && r.reason.message) || 'Fetch failed'
          };
        }
      }

      done += batch.length;
      const tbody = document.getElementById('tbody');
      if (!state.initialLoaded) {
        tbody.innerHTML =
          `<tr><td colspan="5" class="loading-msg">Loading ${symbols.length} USDT pairs from Binance… ${done}/${symbols.length}</td></tr>`;
      }
    }

    if (gen !== state.fetchGen) return;
    state.initialLoaded = true;
    setLastUpdated();
  } finally {
    state.bulkLoadCount--;
  }
}

async function refreshSymbols(symbols, tf) {
  if (symbols.length === 0) return;
  const gen = state.fetchGen;
  const now = Date.now();
  state.bulkLoadCount++;
  try {
    for (let i = 0; i < symbols.length; i += FETCH_CONCURRENCY) {
      if (gen !== state.fetchGen) return;
      const batch = symbols.slice(i, i + FETCH_CONCURRENCY);
      await Promise.allSettled(batch.map(async (sym) => {
        if (gen !== state.fetchGen) return;
        const st = state.symbols[sym];
        if (!st || !st.bars || st.bars.length === 0) {
          try {
            const raw = await fetchKlines(sym, tf, INITIAL_BARS);
            const next = buildSymbolState(sym, raw.slice(0, -1));
            state.symbols[sym] = next;
          } catch (e) {
            if (st) { st.status = 'error'; st.error = e.message; }
          }
          return;
        }
        const lastTime = st.bars[st.bars.length - 1].time;
        try {
          const raw = await fetchKlinesSince(sym, tf, lastTime + 1);
          if (!raw.length) return;
          const newBars = parseKlines(raw).filter(b => b.closeTime <= now);
          if (newBars.length === 0) return;
          st.bars.push(...newBars);
          if (st.bars.length > 3000) st.bars = st.bars.slice(-3000);
          const { highZones, lowZones } = computeZones(st.bars);
          st.highZones = highZones;
          st.lowZones = lowZones;
          const atrArr = calcATRTrailingStop(st.bars);
          let atrLine = NaN;
          for (let j = atrArr.length - 1; j >= 0; j--) {
            if (!isNaN(atrArr[j])) { atrLine = atrArr[j]; break; }
          }
          st.atrLine = atrLine;
          st.status = 'ok';
          st.error = null;
        } catch (e) {
          st.status = 'error';
          st.error = e.message;
        }
      }));
    }
    if (gen !== state.fetchGen) return;
    setLastUpdated();
  } finally {
    state.bulkLoadCount--;
  }
}

/* =====================================================================
   SYMBOL LIST REFRESH — pick up listings/delistings
   ===================================================================== */
async function refreshSymbolList() {
  if (state.symbolRefreshing) return;
  state.symbolRefreshing = true;
  try {
    const gen = state.fetchGen;
    const newList = await fetchUSDTSymbols();
    if (gen !== state.fetchGen) return;

    const oldSet = new Set(state.symbolList);
    const newSet = new Set(newList);
    const added   = newList.filter(s => !oldSet.has(s));
    const removed = state.symbolList.filter(s => !newSet.has(s));

    state.symbolList = newList;
    setSymbolCount(newList.length);

    for (const sym of removed) {
      delete state.symbols[sym];
      state.pendingSymbols.delete(sym);
    }

    if (added.length > 0) {
      // seed state entries so WS updates and UI work while klines load
      for (const sym of added) {
        state.symbols[sym] = {
          bars: [], highZones: [], lowZones: [], atrLine: NaN,
          currentPrice: null, status: 'loading', error: null
        };
      }
      await loadSymbols(added, state.timeframe, gen);
    }

    if (added.length || removed.length) {
      console.log(`Symbol list updated: +${added.length} / -${removed.length} (total ${newList.length})`);
      setLastUpdated();
      scheduleRender();
    }
  } catch (e) {
    console.warn('Symbol list refresh failed:', e);
  } finally {
    state.symbolRefreshing = false;
  }
}

/* =====================================================================
   RENDERING
   ===================================================================== */
function scheduleRender() {
  if (state.renderScheduled) return;
  state.renderScheduled = true;
  setTimeout(() => {
    state.renderScheduled = false;
    renderTable();
  }, 250);
}

function renderZoneSlot(zone, kind) {
  if (!zone) {
    return `<div class="zone na">N/A</div>`;
  }
  const cls = ['zone', kind === 'flipped' ? 'flipped' : ''];
  if (zone.inside) cls.push('inside');
  return `
    <div class="${cls.join(' ')}">
      <div class="row"><span class="lbl">Upper</span><span class="val">${fmtPrice(zone.top)}</span></div>
      <div class="row"><span class="lbl">Lower</span><span class="val">${fmtPrice(zone.bottom)}</span></div>
      <div class="dist">${fmtDist(zone.dist)}${zone.inside ? ' · in zone' : ''}</div>
    </div>`;
}

function renderATRCell(price, atrLine) {
  if (atrLine == null || isNaN(atrLine) || !isFinite(atrLine) || price == null) {
    return `<div class="atr-cell na">N/A</div>`;
  }
  const diff = atrDiffPct(price, atrLine);
  if (!isFinite(diff)) return `<div class="atr-cell na">N/A</div>`;
  if (diff === 0) {
    return `<div class="atr-cell at-line">
      <div class="atr-status">AT LINE <span class="atr-pct">(0.00%)</span></div>
      <div class="atr-line">ATR Line: ${fmtPrice(atrLine)}</div>
    </div>`;
  }
  const isAbove = diff > 0;
  const sign = isAbove ? '+' : '';
  const cls = isAbove ? 'above' : 'below';
  const label = isAbove ? 'ABOVE' : 'BELOW';
  return `<div class="atr-cell ${cls}">
    <div class="atr-status">${label} <span class="atr-pct">(${sign}${diff.toFixed(2)}%)</span></div>
    <div class="atr-line">ATR Line: ${fmtPrice(atrLine)}</div>
  </div>`;
}

function computeRowData(sym) {
  const st = state.symbols[sym];
  if (!st) return { symbol: sym, price: null, atrLine: NaN, supports: [], flippeds: [], error: 'Loading' };
  if (st.status === 'error') {
    return { symbol: sym, price: st.currentPrice, atrLine: st.atrLine ?? NaN, supports: [], flippeds: [], error: st.error || 'Error' };
  }
  if (!st.bars || st.bars.length === 0 || st.currentPrice == null) {
    return { symbol: sym, price: st.currentPrice, atrLine: st.atrLine ?? NaN, supports: [], flippeds: [], error: 'Loading' };
  }
  const supports = getValidZones(st.lowZones, st.currentPrice, true);
  const flippeds = getValidZones(st.highZones, st.currentPrice, true);
  return { symbol: sym, price: st.currentPrice, atrLine: st.atrLine, supports, flippeds, error: null };
}

function closestDist(list) {
  return list.length ? Math.abs(list[0].dist) : Infinity;
}

function filterRow(data) {
  const sf = document.getElementById('supportFilter').value;
  const ff = document.getElementById('flippedFilter').value;
  const af = document.getElementById('atrFilter').value;

  const cS = closestDist(data.supports);
  const cF = closestDist(data.flippeds);

  let okS, okF, okA;
  if (sf === 'all') okS = true;
  else if (sf === 'has') okS = cS < 1;
  else okS = cS >= 1;

  if (ff === 'all') okF = true;
  else if (ff === 'has') okF = cF < 1;
  else okF = cF >= 1;

  if (af === 'all') {
    okA = true;
  } else {
    const cls = classifyATR(data.price, data.atrLine);
    okA = (cls === af);
  }

  return okS && okF && okA;
}

function sortKeyValue(data, key) {
  switch (key) {
    case 'symbol':   return data.symbol;
    case 'price':    return data.price == null ? -Infinity : data.price;
    case 'support':  return closestDist(data.supports);
    case 'flipped':  return closestDist(data.flippeds);
    case 'atr': {
      const d = atrDiffPct(data.price, data.atrLine);
      return isFinite(d) ? d : null;
    }
    default:         return data.symbol;
  }
}

function renderTable() {
  const tbody = document.getElementById('tbody');
  const rowsData = state.symbolList.map(computeRowData);

  const key = state.sortKey;
  const dir = state.sortDir;
  rowsData.sort((a, b) => {
    const va = sortKeyValue(a, key);
    const vb = sortKeyValue(b, key);
    if (key === 'symbol') return String(va).localeCompare(String(vb)) * dir;
    if (va === null && vb === null) return 0;
    if (va === null) return 1;
    if (vb === null) return -1;
    if (va === vb) return 0;
    return (va < vb ? -1 : 1) * dir;
  });

  const parts = [];
  for (const data of rowsData) {
    const hidden = filterRow(data) ? '' : ' hidden';
    let cells;
    if (data.error) {
      cells = `
        <td><div class="pair">${displayPair(data.symbol)}</div></td>
        <td><span class="price">${fmtPrice(data.price)}</span></td>
        <td><span class="empty-cell">${data.error}</span></td>
        <td><span class="empty-cell">${data.error}</span></td>
        <td>${renderATRCell(data.price, data.atrLine)}</td>`;
    } else {
      const supportSlots = [data.supports[0], data.supports[1], data.supports[2]];
      const flippedSlots = [data.flippeds[0], data.flippeds[1], data.flippeds[2]];
      cells = `
        <td><div class="pair">${displayPair(data.symbol)}</div></td>
        <td><span class="price">${fmtPrice(data.price)}</span></td>
        <td><div class="zones">${supportSlots.map(z => renderZoneSlot(z, 'support')).join('')}</div></td>
        <td><div class="zones">${flippedSlots.map(z => renderZoneSlot(z, 'flipped')).join('')}</div></td>
        <td>${renderATRCell(data.price, data.atrLine)}</td>`;
    }
    parts.push(`<tr data-symbol="${data.symbol}" class="${hidden.trim()}">${cells}</tr>`);
  }

  tbody.innerHTML = parts.join('');

  document.querySelectorAll('thead th.sortable').forEach(th => {
    const arrow = th.querySelector('.sort-arrow');
    if (th.dataset.sort === state.sortKey) {
      arrow.textContent = state.sortDir === 1 ? '▲' : '▼';
    } else {
      arrow.textContent = '';
    }
  });
}

/* =====================================================================
   WEBSOCKET — single !miniTicker@arr stream for all symbols
   ===================================================================== */
function connectWebSocket() {
  if (state.ws) {
    try { state.ws.close(); } catch (e) {}
  }
  setWSDot('amber', 'Connecting…');
  const url = WS_URL_BASE + '!miniTicker@arr';

  let ws;
  try {
    ws = new WebSocket(url);
  } catch (e) {
    setWSDot('red', 'WS Error');
    setTimeout(connectWebSocket, 3000);
    return;
  }
  state.ws = ws;

  ws.onopen = () => {
    setWSDot('green', 'Live');
    clearError();
  };

  ws.onmessage = (evt) => {
    let msg;
    try { msg = JSON.parse(evt.data); } catch (e) { return; }
    let tickers = msg && msg.data;
    if (!Array.isArray(tickers)) tickers = Array.isArray(msg) ? msg : [];
    if (tickers.length === 0) return;

    let updated = false;
    for (const t of tickers) {
      const sym = t && t.s;
      if (!sym || !sym.endsWith('USDT')) continue;
      const price = parseFloat(t.c);
      if (!isFinite(price)) continue;

      const st = state.symbols[sym];
      if (st) {
        st.currentPrice = price;
        updated = true;
      } else if (
        !state.bulkLoadCount &&
        state.symbolList.includes(sym) &&
        !state.pendingSymbols.has(sym)
      ) {
        // Known USDT pair with no state yet — load it on demand
        state.pendingSymbols.add(sym);
        state.symbols[sym] = {
          bars: [], highZones: [], lowZones: [], atrLine: NaN,
          currentPrice: price, status: 'loading', error: null
        };
        fetchKlines(sym, state.timeframe, INITIAL_BARS)
          .then(raw => {
            const next = buildSymbolState(sym, raw.slice(0, -1));
            if (next.status === 'ok') {
              const prev = state.symbols[sym];
              next.currentPrice = prev && prev.currentPrice != null
                ? prev.currentPrice
                : next.currentPrice;
            }
            state.symbols[sym] = next;
            scheduleRender();
          })
          .catch(e => console.warn(`On-demand load failed for ${sym}:`, e))
          .finally(() => state.pendingSymbols.delete(sym));
      }
    }
    if (updated) scheduleRender();
  };

  ws.onerror = () => { setWSDot('red', 'WS Error'); };
  ws.onclose = () => {
    setWSDot('red', 'Disconnected');
    setTimeout(connectWebSocket, 3000);
  };
}

/* =====================================================================
   TIMEFRAME HANDLING
   ===================================================================== */
async function switchTimeframe(tf) {
  state.timeframe = tf;
  state.fetchGen++;
  const gen = state.fetchGen;
  state.initialLoaded = false;
  state.symbols = {};
  state.pendingSymbols = new Set();

  document.querySelectorAll('.tf-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tf === tf);
  });

  document.getElementById('tbody').innerHTML =
    '<tr><td colspan="5" class="loading-msg">Loading ' + TF_LABELS[tf] + ' data from Binance…</td></tr>';

  if (state.refreshTimer) { clearTimeout(state.refreshTimer); state.refreshTimer = null; }

  if (state.symbolList.length === 0) {
    try {
      state.symbolList = await fetchUSDTSymbols();
      setSymbolCount(state.symbolList.length);
    } catch (e) {
      showError('Failed to load symbol list: ' + e.message);
      return;
    }
  }

  try {
    await loadSymbols(state.symbolList.slice(), tf, gen);
    if (gen !== state.fetchGen) return;
    renderTable();
    scheduleKlinesRefresh();
  } catch (e) {
    showError('Failed to load klines: ' + e.message);
  }
}

function scheduleKlinesRefresh() {
  if (state.refreshTimer) { clearTimeout(state.refreshTimer); state.refreshTimer = null; }
  const tf = state.timeframe;
  // Refresh a bit after each candle closes; cadence scales with timeframe so we
  // stay within Binance's REST weight budget even with hundreds of pairs.
  const interval = TF_MS[tf] + 30000;
  state.refreshTimer = setTimeout(async () => {
    const gen = state.fetchGen;
    try {
      await refreshSymbols(state.symbolList.slice(), state.timeframe);
      if (gen === state.fetchGen) scheduleRender();
    } catch (e) {
      console.warn('Klines refresh error', e);
    } finally {
      if (gen === state.fetchGen) scheduleKlinesRefresh();
    }
  }, interval);
}

/* =====================================================================
   UI EVENT WIRING
   ===================================================================== */
document.getElementById('tf-group').addEventListener('click', (e) => {
  const btn = e.target.closest('.tf-btn');
  if (!btn) return;
  const tf = btn.dataset.tf;
  if (tf === state.timeframe && state.initialLoaded) return;
  switchTimeframe(tf);
});

document.getElementById('refresh-btn').addEventListener('click', async () => {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  btn.textContent = '⟳ Refreshing…';
  try {
    await refreshSymbolList();
    await refreshSymbols(state.symbolList.slice(), state.timeframe);
    renderTable();
  } catch (e) {
    showError('Refresh failed: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '⟳ Refresh Data';
  }
});

document.getElementById('supportFilter').addEventListener('change', renderTable);
document.getElementById('flippedFilter').addEventListener('change', renderTable);
document.getElementById('atrFilter').addEventListener('change', renderTable);
document.getElementById('reset-filters').addEventListener('click', () => {
  document.getElementById('supportFilter').value = 'all';
  document.getElementById('flippedFilter').value = 'all';
  document.getElementById('atrFilter').value = 'all';
  renderTable();
});

document.querySelectorAll('thead th.sortable').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.sort;
    if (state.sortKey === key) state.sortDir *= -1;
    else { state.sortKey = key; state.sortDir = 1; }
    renderTable();
  });
});

/* =====================================================================
   INIT
   ===================================================================== */
(async function init() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '<tr><td colspan="5" class="loading-msg">Fetching USDT pair list from Binance…</td></tr>';

  // Fetch dynamic symbol list with a few retries
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      state.symbolList = await fetchUSDTSymbols();
      setSymbolCount(state.symbolList.length);
      break;
    } catch (e) {
      if (attempt === 3) {
        showError('Failed to fetch symbol list from Binance: ' + e.message);
        tbody.innerHTML = '<tr><td colspan="5" class="loading-msg">Failed to load symbols. Click Refresh to retry.</td></tr>';
        return;
      }
      await new Promise(r => setTimeout(r, 2000 * attempt));
    }
  }

  connectWebSocket();
  await switchTimeframe('5m');

  // Periodic symbol list refresh (auto add/remove of listings/delistings)
  state.symbolRefreshTimer = setInterval(refreshSymbolList, SYMBOL_REFRESH_MS);
})();

</script>
